<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Каталог браузерных игр, созданных нашей группой"
    />
    <meta name="theme-color" content="#111216" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ffcc4d'/%3E%3Cpath d='M20 23h24a10 10 0 0 1 9 14l-4 10a6 6 0 0 1-10 2l-3-4h-8l-3 4a6 6 0 0 1-10-2l-4-10a10 10 0 0 1 9-14Z' fill='%23111216'/%3E%3Cpath d='M21 32v8m-4-4h8' stroke='%23ffcc4d' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='42' cy='33' r='2' fill='%23ffcc4d'/%3E%3Ccircle cx='46' cy='38' r='2' fill='%23ffcc4d'/%3E%3C/svg%3E"
    />
    <title>Игры нашей группы</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./" aria-label="Игры нашей группы — главная">
        <span class="brand-mark" aria-hidden="true">G</span>
        <span>GAMES<span class="brand-dot">.</span></span>
      </a>
      <p class="header-note">Сделано нашей группой</p>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow"><span></span> Коллекция студенческих проектов</p>
        <div class="intro-row">
          <h1 id="page-title">Выбирай.<br /><em>Играй.</em></h1>
          <p class="intro-copy">
            Здесь собраны игры наших однокурсников. Каждая работа — отдельная
            идея, механика и маленький мир.
          </p>
        </div>
      </section>

      <section class="catalog-section" aria-labelledby="catalog-title">
        <div class="section-heading">
          <h2 id="catalog-title">Все игры</h2>
          <span id="games-count" class="games-count" aria-live="polite"></span>
        </div>

        <div id="catalog" class="catalog" aria-live="polite" aria-busy="true">
          <div class="status-card">
            <span class="loader" aria-hidden="true"></span>
            <h3>Загружаем игры</h3>
            <p>Собираем последние проекты из каталога.</p>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>Учебный проект · <span id="year"></span></p>
      <a href="https://github.com/" target="_blank" rel="noreferrer">GitHub</a>
    </footer>

    <template id="game-card-template">
      <article class="game-card">
        <div class="game-visual" aria-hidden="true">
          <span class="game-number"></span>
          <span class="game-symbol"></span>
        </div>
        <div class="game-info">
          <p class="game-label">Игра</p>
          <h3 class="game-title"></h3>
          <a class="play-link" href="#">
            Запустить
            <span aria-hidden="true">↗</span>
          </a>
        </div>
      </article>
    </template>

    <script src="./script.js" defer></script>
  </body>
</html>
