<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fruit Tales — Увлекательная три-в-ряд</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-full flex flex-col items-center justify-between min-h-screen p-2 sm:p-4">

    <div id="app" class="w-full max-w-md mx-auto flex flex-col h-full min-h-[92vh] justify-between relative z-10">
        
        <!-- HEADER / TOP BAR -->
        <header id="main-header" class="w-full py-2 px-3 flex items-center justify-between glass-panel rounded-2xl shadow-lg mb-2">
            <div class="flex items-center space-x-2">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-pink-500 flex items-center justify-center shadow-md text-xl">
                    🍓
                </div>
                <div>
                    <h1 class="font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-amber-300 tracking-wide text-lg">FRUIT TALES</h1>
                    <p class="text-[10px] text-slate-400 font-medium">Сладкое приключение</p>
                </div>
            </div>
            <div class="flex items-center space-x-1 sm:space-x-2">
                <button onclick="SoundManager.toggleMute()" id="sound-btn" class="w-10 h-10 rounded-xl glass-panel flex items-center justify-center text-slate-200 hover:bg-slate-700/50 transition">
                    🔊
                </button>
                <button onclick="Game.openSettings()" class="w-10 h-10 rounded-xl glass-panel flex items-center justify-center text-slate-200 hover:bg-slate-700/50 transition">
                    ⚙️
                </button>
            </div>
        </header>

        <!-- MAIN VIEW CONTAINER -->
        <main id="view-container" class="flex-1 flex flex-col justify-center relative w-full">
            <!-- Dynamically injected views -->
        </main>

        <!-- FOOTER -->
        <footer class="w-full text-center py-2 text-xs text-slate-500">
            Fruit Tales Match-3 • HTML5 & Tailwind CSS
        </footer>
    </div>

    <!-- NOTIFICATION MODAL -->
    <div id="msg-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-panel p-6 rounded-3xl max-w-sm w-full text-center shadow-2xl animate-pop border border-white/20">
            <div id="modal-icon" class="text-5xl mb-3">🏆</div>
            <h3 id="modal-title" class="text-2xl font-bold text-white mb-2">Победа!</h3>
            <p id="modal-text" class="text-slate-300 text-sm mb-6">Уровень успешно пройден!</p>
            <div id="modal-buttons" class="flex space-x-3 justify-center"></div>
        </div>
    </div>

    <!-- Script File -->
    <script src="script.js"></script>
</body>
</html>
