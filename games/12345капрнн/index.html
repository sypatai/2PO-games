<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дорога до колледжа</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Georgia,"Times New Roman",serif;background:#05060d;color:#e8e6f0}
#app{max-width:820px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:#0c0e1a;box-shadow:0 0 60px #000}
#stage{flex:1;min-height:180px;position:relative;display:flex;align-items:center;justify-content:center;transition:background .6s;overflow:hidden}
#stage::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.65) 100%);pointer-events:none}
#scene{font-size:min(30vw,170px);filter:drop-shadow(0 8px 14px rgba(0,0,0,.6)) brightness(.85)}
#sp{position:absolute;right:6%;bottom:-18px;font-size:min(22vw,110px);z-index:2;animation:pop .25s;filter:drop-shadow(0 0 12px rgba(0,0,0,.8))}
@keyframes pop{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
#clock,#place{position:absolute;top:10px;z-index:3;background:rgba(5,6,13,.75);color:#e9c46a;padding:4px 10px;border-radius:4px;font-size:14px;border:1px solid rgba(233,196,106,.35)}
#clock{left:12px}
#place{right:12px;color:#c9c6dc;border-color:rgba(255,255,255,.2)}
#box{background:rgba(8,9,18,.96);border-top:2px solid #e9c46a;padding:18px 18px 22px;min-height:230px;display:flex;flex-direction:column;gap:12px}
#name{align-self:flex-start;background:#e9c46a;color:#0c0e1a;font-weight:700;padding:3px 14px;border-radius:4px;min-height:26px;letter-spacing:.5px}
#name:empty{visibility:hidden}
#txt{font-size:19px;line-height:1.55;min-height:84px;cursor:pointer;color:#f1eff8}
#ch{display:flex;flex-direction:column;gap:8px}
button{font:inherit;cursor:pointer}
.opt{background:rgba(255,255,255,.06);color:#f1eff8;border:1px solid rgba(233,196,106,.45);border-radius:6px;padding:12px 14px;text-align:left;font-size:17px}
.opt:hover,.opt:focus-visible{background:#e9c46a;color:#0c0e1a;outline:none}
#hint{font-size:13px;opacity:.5;align-self:flex-end;font-style:italic}
.menu{padding:28px 18px;overflow:auto;flex:1;background:radial-gradient(circle at 50% 0,#1d2144,#0c0e1a 70%)}
.menu h1{margin:0 0 4px;font-size:32px;color:#e9c46a;font-weight:400;letter-spacing:1px}
.menu p{margin:0 0 20px;color:#b9b6cf}
.card{display:flex;gap:14px;align-items:center;width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(233,196,106,.4);border-radius:8px;padding:12px 14px;margin-bottom:12px;text-align:left;color:#e8e6f0}
.card:hover,.card:focus-visible{background:rgba(233,196,106,.18);outline:none}
.card .e{font-size:44px}
.card b{font-size:20px;display:block;color:#e9c46a;font-weight:400}
.card small{font-size:14px;color:#b9b6cf}
.end{padding:22px 18px;background:#05060d;color:#e8e6f0;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;border-top:2px solid #e9c46a}
.end h2{margin:0;font-size:28px;color:#e9c46a;font-weight:400}
.end p{margin:0;font-size:18px;line-height:1.5;max-width:560px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{background:#e9c46a;color:#0c0e1a;border:0;border-radius:6px;padding:11px 16px;font-weight:700}
.btn.alt{background:transparent;color:#e9c46a;border:1px solid #e9c46a}

@keyframes fall{from{transform:translateY(-30px) rotate(0);opacity:0}15%{opacity:.8}to{transform:translateY(105vh) rotate(300deg);opacity:0}}
@keyframes shk{0%,100%{transform:none}20%{transform:translate(-9px,5px)}40%{transform:translate(8px,-6px)}60%{transform:translate(-6px,-4px)}80%{transform:translate(5px,6px)}}
@keyframes fin{from{opacity:0}to{opacity:1}}
.pt{position:absolute;top:0;z-index:1;pointer-events:none;animation:fall linear infinite}
.dec{position:absolute;bottom:6px;z-index:1;opacity:.5;filter:brightness(.7);pointer-events:none}
#stage.shake #scene{animation:shk .5s 2}
#stage{animation:fin .7s}

#cv{position:absolute;inset:0;width:100%;height:100%;animation:zm 40s linear forwards}
@keyframes zm{to{transform:scale(1.1)}}
@keyframes gr{to{background-position:60px 40px}}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9;opacity:.08;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");animation:gr .5s steps(3) infinite}
#stage::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(#000 0 5%,transparent 5% 95%,#000 95%)}
#stage::after{z-index:2}
#clock,#place{z-index:4;top:calc(5% + 8px)}
#sp{z-index:3;right:3%;bottom:0;width:min(34%,210px);font-size:0}
#sp svg{width:100%;display:block;filter:drop-shadow(0 0 18px #000) brightness(.78) contrast(1.1)}
.menu{padding:0;display:flex;flex-direction:column;background:#0c0e1a}
.hd{flex:0 0 42%;min-height:230px;position:relative;overflow:hidden}
.hd::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,#0c0e1a)}
.ttl{position:absolute;left:18px;bottom:14px;z-index:3}
.ttl small{color:#e9c46a;letter-spacing:2px;font-size:14px}
.ttl h1{margin:2px 0 0;font-size:clamp(30px,8vw,48px);text-shadow:0 2px 14px #000}
.list{padding:8px 18px 22px}
.card{background:linear-gradient(90deg,rgba(255,255,255,.07),rgba(255,255,255,.02))}
.card svg{width:54px;height:70px;border-radius:6px;background:linear-gradient(#2b3260,#10121f);flex:none}
#snd{position:fixed;right:10px;bottom:10px;z-index:10;background:rgba(5,6,13,.8);color:#e9c46a;border:1px solid rgba(233,196,106,.5);border-radius:4px;padding:5px 10px;font-size:13px}
.end{max-height:58%;overflow:auto}

.tcard{position:absolute;z-index:5;left:50%;top:42%;transform:translate(-50%,-50%);font-size:clamp(22px,6vw,36px);letter-spacing:3px;color:#e9c46a;text-shadow:0 2px 14px #000;white-space:nowrap;opacity:0;animation:tc 2.6s ease forwards;pointer-events:none}
@keyframes tc{0%{opacity:0;letter-spacing:12px}25%,70%{opacity:1;letter-spacing:3px}100%{opacity:0}}
.wcap{position:absolute;z-index:5;left:50%;bottom:11%;transform:translateX(-50%);width:86%;text-align:center;font-size:19px;line-height:1.4;color:#f1eff8;text-shadow:0 2px 10px #000;animation:fin 1.4s}
.wskip{position:absolute;right:12px;bottom:8px;z-index:5;font-size:12px;opacity:.5}
@keyframes br{50%{transform:translateY(-3px) scale(1.012)}}
#sp svg{animation:br 3.6s ease-in-out infinite;transform-origin:bottom}
.opt{transition:transform .15s,background .15s}.opt:hover{transform:translateX(6px)}
@media (prefers-reduced-motion:reduce){.tcard,.wcap,#sp svg{animation:none}.tcard{opacity:1}}
@media (prefers-reduced-motion:reduce){.pt,#stage,#stage.shake #scene,#sp{animation:none}#stage{transition:none}}
#sp svg{filter:drop-shadow(0 0 18px #000) brightness(.92) contrast(1.08)}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ====== ДАННЫЕ ======
var BG={home_a:['#2b2a4c','#7a4e6b','🏢','7:30','Дом Адлана'],home_i:['#3a2540','#a0566e','🏡','7:30','Дом Исмиры'],home_s:['#1c3a3a','#4d6b4a','🛖','7:30','Дом Сыпатая'],street:['#1e2a4a','#3e5a6e','🏙️','8:10','Улица'],park:['#10302a','#2d6a4f','🌳','8:10','Парк'],bus:['#20263a','#4a5670','🚌','8:10','Маршрутка'],college:['#23284d','#4a5fa8','🏫','8:30','Колледж'],taxi:['#3a2d14','#9a6a26','🚕','8:05','Такси'],yard:['#2e2418','#6a7a3a','🏘️','7:50','Дворы'],stop:['#1c2f3a','#4a5a9a','🚏','7:55','Остановка']};
var SP={'Адлан':'🧑‍🎓','Полат':'😎','Исмира':'👩‍🎓','Айлин':'👧','Аялым':'👩‍🦰','Айым':'👱‍♀️','Сыпатай':'🧒','Староста':'🧐','Таксист':'👨‍✈️','Старичок':'👴','Девушка':'🙍‍♀️','Препод':'👨‍🏫'};
var HEROES={a:['Адлан','🧑‍🎓','Ходит с другом Полатом. Ждать его или уйти?','a0'],i:['Исмира','👩‍🎓','Подруги, такси или пешком — и риск опоздать.','i0'],s:['Сыпатай','🧒','Идёт один: велосипед, автобус, самокат или дворы.','s0']};
var S={};
function sc(id,bg,lines,ch){S[id]={bg:bg,lines:lines,ch:ch}}
function en(id,bg,title,text,icon){S[id]={bg:bg,end:1,title:title,text:text,icon:icon}}

// --- АДЛАН ---
sc('a0','home_a',['|Утро. Будильник орёт в третий раз, до пары в колледже, а она начинается в 8:30, остался час.','|Телефон вибрирует — пишет Полат.','Полат|Адлан, я проснулся! Подожди меня у подъезда, я выйду через пять минут.','Адлан|Твои «пять минут» меряют геологическими эпохами. За это время вымирали мамонты.','|Ты уже одет и стоишь у двери.'],[['Подождать Полата','a_wait'],['Уйти без него','a_go']]);
sc('a_wait','street',['|Проходит пять минут. Потом десять.','Адлан|Полат, ты где?','Полат|Уже бегу! Только носок найду!','Адлан|Один носок найдёшь, второй потеряешь по дороге. Я тебя знаю.'],[['Подождать ещё','a_wait2'],['Сказать «догоняй» и уйти','a_go']]);
sc('a_wait2','street',['|Из-за поворота выскакивает Полат: куртка нараспашку, волосы торчат в разные стороны, в зубах зажат кусок хлеба.','Полат|Всё, я тут! Побежали?','Адлан|У тебя носки разные.','Полат|Это стиль. Называется «авангард».','|Часы показывают 8:10. Пара в 8:30.'],[['Бежать на маршрутку','a_bus'],['Идти пешком через парк','a_park']]);
sc('a_bus','bus',['|Маршрутка застряла позади трактора на Жибек Жолы. Водитель разводит руками.','Полат|Может, выйдем и побежим?','Адлан|Мы стоим так долго, что рядом уже начали строить дом.'],[['Выйти и бежать','e_a_run'],['Ждать, вдруг поедет','e_a_late']]);
sc('a_park','park',['Полат|Адлан, ты лабораторную по программированию сделал? Дай списать, как всегда.','Адлан|Конечно сделал. А свою ты опять не открывал?','Полат|Открывал! Открыл и закрыл. Это считается?','Адлан|Это считается, как похороны: пришёл, постоял, ушёл.'],[['Дать списать','e_a_cheat'],['Объяснить тему по дороге','e_a_help']]);
sc('a_go','street',['|Ты идёшь один. Через пару минут телефон вибрирует.','Полат|Серьёзно?! Я же сказал, что бегу…','Полат|Ты бросил меня, как мою лабораторную: на самом интересном месте.'],[['Ответить: «Встретимся на паре»','e_a_solo'],['Позвонить и извиниться','e_a_sorry']]);
en('e_a_run','college','Спринтеры','Вы влетаете в аудиторию за секунду до препода. Полат падает на парту: «Адлан, я сейчас упаду». Но вы успели!','🏃');
en('e_a_late','college','Опоздали вместе','Маршрутка дотащилась в 8:50. Препод посмотрел на вас и на часы. Зато было о чём поговорить в пробке.','🕘');
en('e_a_cheat','college','Одинаковые ошибки','Препод сразу заметил две одинаковые ошибки в программах. Теперь вы оба пересдаёте, а отличникам это обидно вдвойне. Дружба крепкая, репутация — нет.','📝');
en('e_a_help','college','Верный друг','Пока шли через парк, Адлан объяснил тему, и Полат впервые за месяц написал код сам. На паре он получил пятёрку, как и положено отличнику, и купил тебе шаурму.','🤝');
en('e_a_solo','college','Сам по себе','Ты пришёл первым и занял лучшее место. Полат появился на третьей паре и три дня делал вид, что обижен.','🪑');
en('e_a_sorry','college','Мир восстановлен','Полат вздохнул в трубку: «Ладно, в следующий раз жду я». Вы встретились у входа и вместе пошли на пару.','☮️');

// --- ИСМИРА ---
sc('i0','home_i',['|Исмира красит ресницы у зеркала. В чате девочек шумно.','Айлин|Выходим в 8:00 у остановки! Не опаздывай!','Аялым|Я возьму тебе булочку 🥐','Айым|А я возьму хорошее настроение. Бегом!','|А за окном как раз стоит свободное такси.'],[['Пойти с подругами','i_girls'],['Вызвать такси','i_taxi'],['Пойти пешком одной','i_walk']]);
sc('i_girls','stop',['|У остановки возле больницы стоят три знакомые фигуры. Айлин машет рукой, Аялым что-то жуёт, а Айым уже достала телефон для первого кадра.','Айлин|Наконец-то! Автобус через две минуты.','Аялым|Рядом кофейня. Я бы выпила кофе…','Айым|А я бы сфоткалась на фоне рассвета!','Исмира|Девочки, пара через двадцать минут.'],[['Зайти за кофе','e_i_coffee'],['Сразу на автобус','i_girls2']]);
sc('i_girls2','college',['|Вы вбегаете в колледж. У входа стоит строгая кураторша с журналом.','Куратор|Почему вы позже звонка на две минуты?'],[['Сказать правду','e_i_honest'],['Придумать отмазку','e_i_excuse']]);
sc('i_taxi','taxi',['Таксист|Куда едем?','Исмира|В колледж, пожалуйста. Быстро.','Таксист|Быстро — это как в кино или по правилам?','Исмира|По правилам. Но если опоздаю, то как в кино.','Таксист|Тогда пристегнись. У меня три правила: не хлопать дверью, не плакать и не говорить «уже скоро».'],[['Поболтать с таксистом','e_i_chat'],['Уткнуться в телефон','e_i_phone']]);
sc('i_walk','street',['|Исмира идёт пешком. На часах 8:10, пара в 8:30, а идти ещё двадцать пять минут.','Исмира|Ну всё, я опоздаю…','Исмира|А староста, между прочим, должна подавать пример. Пример: как красиво опаздывать.','Айым|Исмира, ты где? Мы заняли тебе место!'],[['Бежать изо всех сил','e_i_run'],['Идти спокойно и написать, что опоздаешь','e_i_calm']]);
en('e_i_coffee','college','Весёлое опоздание','Кофе был отличный, фото тоже. На пару вы пришли в 8:45 с пластиковыми стаканчиками. Препод только вздохнул.','☕');
en('e_i_honest','college','Честность — лучшая политика','Кураторша выслушала и записала только «замечание». Вы получили лёгкий выговор и уважение за честность.','📋');
en('e_i_excuse','college','Отмазка не прошла','«Автобус сломался!» — сказала Исмира. Кураторша: «Я на нём приехала». Дежурство по аудитории на неделю на четверых.','🧹');
en('e_i_chat','college','Семейные связи','Оказалось, таксист — дядя Айым! Он отвёз бесплатно и высадил прямо у входа. Ты пришла вовремя.','👨‍👧');
en('e_i_phone','college','Королева такси','Ты приехала на десять минут раньше. Подруги пишут, что застряли у кофейни. Ты заняла им места и держала оборону.','👑');
en('e_i_run','college','Пробежка на каблуках','Ты влетела в класс красная и запыхавшаяся. Опоздала на минуту, зато девочки зааплодировали.','👠');
en('e_i_calm','college','Спокойно и с опозданием','Ты пришла на двадцать минут позже. Преподаватель принял извинение, а подруги сохранили конспект.','📓');

// --- СЫПОТАЙ ---
sc('s0','home_s',['|Сыпатай человек самостоятельный. Друзья ещё спят, а он уже на ногах.','Сыпатай|Сегодня иду один. Вопрос только — на чём?','Сыпатай|Варианты: ноги, надежда и чудо. Чудо сейчас в пробке.'],[['Велосипед','s_bike'],['Автобус','s_bus'],['Пешком дворами','s_walk'],['Самокат','s_scooter']]);
sc('s_bike','street',['|Утро только начинается: над крышами висит туман, в соседнем дворе кукарекает петух, а с гор тянет холодом.','|Цепь звякает. Впереди развилка.','Сыпатай|По дороге короче, но там машины. Через парк дольше, зато красиво.'],[['По дороге','e_s_road'],['Через парк','s_park']]);
sc('s_park','park',['|В парке на лавке сидит старичок с шахматами.','Старичок|Молодой человек, партию? Пять минут!'],[['Сыграть','e_s_chess'],['Вежливо отказаться','e_s_ride']]);
sc('s_bus','bus',['|Автобус забит как банка с шпротами. Следующий через двенадцать минут.'],[['Втиснуться','e_s_crowd'],['Подождать следующий','s_wait']]);
sc('s_wait','stop',['|На остановке стоит девушка с тубусом и вздыхает.','Девушка|Мой автобус тоже не пришёл. А мне на экзамен.'],[['Предложить такси на двоих','e_s_taxi'],['Пойти пешком','e_s_late']]);
sc('s_walk','yard',['|Во дворах пахнет жареной картошкой. Вдруг из-за забора выскакивает огромная собака.','Сыпатай|Спокойно, спокойно…','Сыпатай|Это не паника. Это ускоренная версия спокойствия.'],[['Угостить печеньем','e_s_dog'],['Обойти стороной','s_walk2']]);
sc('s_walk2','yard',['|Ты обходишь двор и попадаешь в тупик. Впереди невысокий забор.'],[['Перелезть через забор','e_s_fence'],['Вернуться назад','e_s_late']]);
sc('s_scooter','street',['|Самокат летит как ветер. Впереди огромная лужа.'],[['Прыгнуть через лужу','e_s_jump'],['Объехать','e_s_ride']]);
en('e_s_road','college','Быстро, но нервно','Ты приехал за 15 минут, но дважды чудом не попал под машину. Нервов хватит до конца недели.','🚦');
en('e_s_chess','college','Шахматный гений','Ты выиграл партию за пять минут. Старичок оказался преподавателем колледжа. Он поставил тебе «отлично» вперёд.','♟️');
en('e_s_ride','college','Идеальное утро','Ты приехал вовремя, в хорошем настроении, и ни с кем не поссорился. Редкий случай.','🌞');
en('e_s_crowd','college','Консервы','Ты доехал, но тебя прижало к двери. Вышел помятый, с чужим зонтиком в рюкзаке. Вовремя, но странно.','☂️');

function line(){
  var p=cur.lines[li].split('|'),who=p[0],text=p[1];
  document.getElementById('name').textContent=who;
  document.getElementById('sp').textContent=SP[who]||'';
  document.getElementById('ch').innerHTML='';
  var t=document.getElementById('txt'),i=0;typing=true;t.textContent='';
  document.getElementById('hint').style.visibility='visible';
  clearInterval(timer);
  timer=setInterval(function(){i++;t.textContent=text.slice(0,i);if(i>=text.length)finish(text)},18);
}
function finish(text){
  clearInterval(timer);typing=false;
  document.getElementById('txt').textContent=text;
  if(li>=cur.lines.length-1){
    document.getElementById('hint').style.visibility='hidden';
    var ch=document.getElementById('ch');
    cur.ch.forEach(function(c){var b=el('button','opt',c[0]);b.onclick=function(){if(c[2])G[c[2]]=1;go(c[1])};ch.appendChild(b)});
  }
}
function advance(){
  var text=cur.lines[li].split('|')[1];
  if(typing){finish(text);return}
  if(li<cur.lines.length-1){li++;line()}
}

function endScreen(id){

en('f_a_best','dusk','Лучшие друзья второго курса','Когда в 15:40 прозвенел звонок, вы с Полатом вышли из аудитории последними. Контрольная осталась позади, Полат уже прикидывал, у кого списать завтра, а в телефоне уже лежал план на вечер.<br><br>На улице темнело раньше обычного, и моросил тот же дождь, что и утром. Полат шёл рядом и впервые за день молчал по-настоящему, без шуток. «Знаешь, — сказал он, — я бы без тебя на втором курсе не продержался». Адлан улыбнулся и ответил, что и сам бы скучал.<br><br>Домой вы шли вместе, как в первый день. Иногда обычный вторник оказывается началом дружбы на много лет.','🤝');
en('f_a_kvn','dusk','Голос команды','Репетиция КВН затянулась до семи. Адлан сначала только слушал, а потом придумал шутку про расписание. Зал смеялся так, что Исмира закрыла дверь.<br><br>Тебя взяли в основной состав. Полат, красный от смеха, шептал, что это лучшая пара в его жизни. Во дворе колледжа горели фонари, и ты впервые почувствовал себя частью чего-то большего.<br><br>Домой ты шёл уставший, но улыбался. Завтра в расписании снова история, но теперь у тебя есть сцена.','🎤');
en('f_a_cheat','dusk','Цена шпаргалки','Препод заметил, как Полат разворачивает лист, и молча положил свою ладонь на ваши работы. Контрольная ушла на пересдачу, а в журнале появилась строчка с замечанием.<br><br>Вы вышли в сумерки молча. Дождь стучал по козырьку, фонари отражались в лужах. Полат наконец тихо сказал: «Прости, что втянул тебя». Адлан пожал плечами, но было видно, что он тоже расстроен.<br><br>Через неделю вы пересдали на пятёрки и поклялись, что больше никогда. Урок вышел дорогим, но запомнился надолго.','📝');
en('f_a_calm','dusk','Обычный хороший день','Пары закончились ровно в 15:40. Ты собрал сумку, надел куртку и вышел во двор, где пахло мокрым асфальтом и первой осенью.<br><br>Полат убежал на остановку, крикнув, что напишет вечером. Ты шёл один, слушал шум дождя и думал о том, что день прошёл спокойно: без побед и без провалов.<br><br>Дома мама уже накрыла на стол. Иногда лучший день — тот, о котором потом и рассказать нечего.','🌧️');

en('f_i_party','dusk','Вечер, который запомнят','После пар вы вчетвером остались в актовом зале. Айым развешивала гирлянды, Аялым спорила про музыку, Айлин искала скотч. Ты стояла на стремянке и думала, что давно так не смеялась.<br><br>Кураторша, обычно строгая, принесла чай и сказала: «Вы лучшая команда этого года». За окном погасли фонари, а в зале мерцали огоньки.<br><br>Домой вы шли толпой, обнявшись, под одним зонтом. И каждая из вас знала, что в субботу будет что-то настоящее.','🎉');
en('f_i_friends','dusk','Зачёт на четверых','Ты тихонько объяснила Айлин задачу, и она, вздохнув, решила её сама. К звонку вы сдали работы вместе.<br><br>На выходе Аялым достала булочки, которые приберегла с утра. Они остыли, но вкуснее вы ничего не ели. Айым сфотографировала вас на ступеньках, и снимок вышел тёплым, несмотря на дождь.<br><br>В тот день ты поняла, что дружба измеряется не оценками, а тем, кто останется с тобой после последнего звонка.','📚');
en('f_i_talk','dusk','Болтали до звонка','Обед растянулся на час, потом на перемену, потом на половину пары. Вы смеялись так, что соседний столик оборачивался.<br><br>Зачёт ты написала на «отлично»: болтовня болтовнёй, а материал ты знала. Так что даже ленивый день у отличницы остаётся отличным. На выходе Айлин сказала: «Зато мы так хорошо поговорили!»<br><br>Вечером ты поймала себя на мысли, что завтра обязательно подготовишься. Обязательно. Почти точно.','☕');
en('f_i_study','dusk','Отличница','Ты писала зачёт, не поднимая головы. Лампы гудели, дождь стучал в окно, а время шло к 15:40. Ты сдала работу первой и получила «отлично».<br><br>Девочки вышли позже: уставшие, но живые. Айлин обняла тебя за плечи и сказала, что без твоих конспектов они бы пропали. Ты улыбнулась, но внутри было странное чувство, будто ты что-то пропустила.<br><br>В автобусе по дороге домой ты открыла чат. Там уже ждали сообщения от всех троих. И стало легче.','🏅');

sc('cs0','hall',['late?|Ты влетаешь в колледж на ходу, ещё запыхавшийся. В коридоре пахнет кофе и мокрыми куртками.','!late?|В колледже у гимназии шумно, как обычно: на крыльце толпятся ребята из соседних сёл. Второй курс — уже не новичок, но и не старшекурсник.','met?Айша|О, мой спаситель с остановки! Ты тоже тут учишься?','met?Сыпатай|Второй курс. А ты, значит, третий?','!met?|Впереди девушка с огромным тубусом. Она идёт быстро, ломает шаг и вдруг роняет всё на пол. Листы разлетаются по плитке.','!met?Айша|Ой! Осторожно, там чертежи!'],[['Помочь собрать листы','cs_break','help'],['Пройти мимо','cs_break']]);
sc('cs_break','hall',['|Перемена. Дождь стучит в большие окна коридора.','Айша|Спасибо. Я Айша, третий курс, архитектурное отделение. А ты?','Сыпатай|Сыпатай, второй курс.','help?Айша|Ты хорошо ориентируешься в чертежах для первого раза.','!help?Айша|Ты тот, кто прошёл мимо? Ладно, мне всё равно нужен человек с руками.','Адлан|Сыпатай, лабораторная через десять минут, вся группа ждёт!','Айша|У меня в два защита макета. Ты не поможешь донести его из мастерской?'],[['Согласиться помочь','cs_lunch','carry'],['Сказать, что у тебя пара','cs_lunch']]);

sc('cs_def','class',['|В аудитории тихо. На столе стоит макет: белый картон, тонкие линии, маленькие деревья из проволоки.','carry?|Ты стоишь у входа с коробкой и боишься дышать. Айша кивает тебе и выходит к комиссии.','careful?|Макет доехал целым, ни одного обломка.','!careful?|Один угол макета слегка погнулся, но Айша быстро поправила его пальцем.','Айша|Дом стоит на склоне, чтобы река была видна из каждой комнаты…','|Голос у неё сначала срывается, но потом становится ровным и уверенным. Комиссия молчит, кто-то кивает.'],[['Остаться на защите и слушать','cs_last','stay'],['Уйти на свою пару','cs_last']]);

en('f_s_close','dusk','Теперь вы знакомы по-настоящему','Вы вышли из колледжа в ранние сумерки. Дождь почти закончился, на асфальте дрожали отражения фонарей. Айша шла рядом и вдруг начала смеяться: тихо, потом громче. «Три месяца, — сказала она. — Три месяца я боялась именно этого дня».<br><br>Вы дошли до остановки пешком, хотя автобус стоял прямо у входа. Она рассказывала про свой первый чертёж, про город, который хочет построить, про то, как трудно быть старше всех на проекте. Ты слушал и понимал, что давно не слушал так никого.<br><br>На прощание она записала тебе свой номер на обороте билета. «Завтра покажу, как делать макеты. Если ты захочешь». Автобус ушёл, а вы ещё минуту стояли под фонарём.','🌆');
en('f_s_friend','dusk','Старшая подруга','День прошёл так, как редко проходят дни второго курса: ты узнал человека, который старше тебя на год, но уже знает, чего хочет. Айша поделилась с тобой конспектами и обещала познакомить со своей группой.<br><br>На выходе вы попрощались тепло, но без лишних слов. Ты шёл домой и думал о её макете: маленьком доме на склоне, где вода видна из каждого окна.<br><br>Может быть, это начало чего-то большего. А может, просто хорошая дружба. Время покажет.','🏠');
en('f_s_alone','dusk','Девушка с тубусом','День закончился, и ты вышел во двор один. Дождь прекратился, воздух стал прозрачным, а на асфальте остались лужи, в которых отражалось небо.<br><br>Ты вспомнил девушку с тубусом: как она нервничала, как держала чашку чая обеими руками. И подумал, что мог бы остаться, мог бы помочь, мог бы просто сказать слово.<br><br>Ты шёл домой и надеялся, что завтра увидишь её снова в том же коридоре. А если нет, то хотя бы узнаешь, чем всё закончилось.','🌫️');

en('f_a_derby','dusk','Матч до темноты','Во дворе вы с Полатом доиграли ещё до звонка, а после пар к вам присоединилась вся группа. Ворота сделали из рюкзаков, мяч то и дело тонул в луже, а Аялым судила, не скрывая, что болеет за обоих.<br><br>Счёт вышел 7:7, и компот пришлось покупать вместе. Исмира махнула рукой из окна второго этажа: ей тоже захотелось выйти.<br><br>Домой Адлан возвращался в мокрой куртке, с грязными коленями и странной лёгкостью. Иногда день удаётся оттого, что ты просто побегал.','⚽');
en('f_a_tutor','dusk','Репетитор Полата','Лабораторная Полата за обедом ожила: цикл наконец заработал, и Полат хлопнул по клавиатуре так, что соседи обернулись.<br><br>После звонка Адлан задержался у преподавателя, и тот сказал: «Вы объясняете лучше, чем я». Это прозвучало как шутка, но запомнилось всерьёз.<br><br>Вечером Полат прислал скриншот зелёных тестов с подписью «Мой репетитор». Адлан улыбнулся и подумал, что объяснять другому значит понимать вдвое глубже.','💻');
en('f_i_photo','dusk','Кадр дня','Айым сняла вас на фоне стены с граффити, и снимок вышел таким живым, что кураторша попросила его для стенда колледжа. Айлин на нём смеётся с закрытыми глазами, Аялым держит булочку, как трофей.<br><br>Зачёт Исмира сдала на «отлично», как всегда, и почти без напряжения. Зато вечером под фото набралась сотня лайков, а Полат переименовал снимок в «Лучшую пару года».<br><br>Она долго смотрела на экран и думала, что такие кадры потом вспоминаются лучше любых оценок.','📸');
en('f_i_notes','dusk','Записки с последней парты','Записка для Айлин ходила по ряду всю первую пару. Внутри были шутки про преподавателя, рисунок кота и тайный план на субботу. Преподаватель сделал вид, что ничего не заметил.<br><br>К концу пары Айлин ответила целой страницей, и вы вдвоём прыснули в рукав. Оценок это не улучшило, зато вы стали ближе.<br><br>Вечером Исмира достала записку из кармана и положила между страниц тетради. Когда-нибудь будет приятно её перечитать.','✉️');
en('f_s_speech','dusk','Речь без бумажки','Вы дважды прогнали защиту в пустой аудитории: Сыпатай изображал комиссию с самым строгим лицом, Айша смеялась и сбивалась. На третий раз слова легли ровно.<br><br>Комиссия слушала молча, а потом спросила про реку под домом. Айша ответила так, будто рассказывала о собственном дворе. Ты стоял у двери и впервые за день не знал, куда деть руки.<br><br>На остановке она сказала, что запомнит, как её слушали не перебивая. Ты кивнул и понял, что запомнишь это тоже.','🎤');
en('f_s_model','dusk','Запасное деревце','Ты нёс макет шаг за шагом, и ни одно проволочное деревце не дрогнуло. Айша заметила это только на защите, когда комиссия подошла ближе, а поправлять ничего не пришлось.<br><br>После пар она протянула тебе крошечную проволочную ёлочку: «Запасная. Она тоже видела, как ты шёл по лестнице». Ты положил её в карман, как что-то хрупкое.<br><br>Дома ёлочка встала у монитора. Ты не мог объяснить, почему улыбаешься, глядя на кусок проволоки.','🌲');
